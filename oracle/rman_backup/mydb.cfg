# ==============================================================================
# rman_backup.sh config dosyası (bash tarafından source edilir)
# ==============================================================================

# Veritabanı
ORACLE_SID=MYDB
ORACLE_BASE=/u01/app/oracle
ORACLE_HOME=/u01/app/oracle/product/19/dbhome_1

# Konumlar
# BACKUP_LOC script tarafından oluşturulmaz; yoksa (örn. NFS bağlı değilse) script çalışmaz.
BACKUP_LOC=/backup_nfs/MYDB/RMAN
LOG_DIR=/home/oracle/scripts/log

# Performans
PARALLELISM=4

# Saklama süreleri (gün, sadece sayı)
PITR_RET=14          # Bu süre içindeki herhangi bir ana dönülebilir (recovery window)
WEEKLY_RET=91        # Haftalık KEEP full backup'ların saklama süresi
ARCH_LOCAL_RET=2     # Backup'ı alınmış archivelog'lar sunucuda kaç gün daha tutulsun
LOG_RET=30           # Script loglarının saklama süresi

# Zamanlama
L0_DAY=7             # PITR zincirinin L0 günü (1=Pzt ... 7=Paz)
LOCK_WAIT_MIN=360    # daily/weekly, başka bir RMAN işi bitsin diye en fazla kaç dakika beklesin

# Archivelog silme politikası
# Data Guard primary'de: "APPLIED ON ALL STANDBY BACKED UP 1 TIMES TO DEVICE TYPE DISK"
ARCH_DELETION_POLICY="BACKED UP 1 TIMES TO DEVICE TYPE DISK"
